# 현재 이슈 상태를 JSON 으로 출력한다.
# 화면 미리보기를 만들거나 상태를 확인할 때 수동으로 실행한다.
name: 뉴스 상태 내보내기

on:
  workflow_dispatch:

env:
  PROJECT_REF: unpkytftbetzoernnedc

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: psql 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 이슈 상태 출력
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "===SNAPSHOT_START==="
          psql -h "aws-1-ap-northeast-2.pooler.supabase.com" -p 5432 \
            -U "postgres.$PROJECT_REF" -d postgres \
            -tA -v ON_ERROR_STOP=1 -f supabase/sql/export_snapshot.sql
          echo "===SNAPSHOT_END==="
