# RSS 후보 주소가 실제로 동작하는지 확인한다.
# scripts/feed-candidates.txt 의 목록을 하나씩 받아 기사 개수를 센다.
name: RSS 주소 점검

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 후보 주소 확인
        run: |
          printf '%-12s %-6s %-6s %s\n' "언론사" "응답" "기사" "주소"
          echo "--------------------------------------------------------------------------"
          while IFS='|' read -r name url; do
            case "$name" in ''|\#*) continue ;; esac
            code=$(curl -sS -L -m 20 -o /tmp/feed.xml -w "%{http_code}" \
              -H "User-Agent: korea-news-issue-bot/1.0 (+RSS reader)" \
              -H "Accept: application/rss+xml, application/xml, text/xml, */*" \
              "$url" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              items=$(grep -o "<item[ >]\|<entry[ >]" /tmp/feed.xml 2>/dev/null | wc -l | tr -d ' ')
              dates=$(grep -o "<pubDate>\|<published>\|<dc:date>" /tmp/feed.xml 2>/dev/null | wc -l | tr -d ' ')
              printf '%-12s %-6s %-6s %s\n' "$name" "$code" "$items" "$url"
              if [ "$items" != "0" ] && [ "$dates" = "0" ]; then
                echo "             ^ 발행 시간 태그가 없어 사용할 수 없습니다"
              fi
            else
              printf '%-12s %-6s %-6s %s\n' "$name" "$code" "-" "$url"
            fi
          done < scripts/feed-candidates.txt
