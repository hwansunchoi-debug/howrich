# 뉴스 서비스를 Supabase 에 설치한다.
#
# GitHub > Actions > "뉴스 서비스 설치" > Run workflow 로 실행한다.
# 먼저 GitHub > Settings > Secrets and variables > Actions 에
# 아래 4개를 등록해야 한다.
#   SUPABASE_ACCESS_TOKEN    supabase.com/dashboard/account/tokens 에서 발급
#   SUPABASE_DB_PASSWORD     Supabase > Project Settings > Database 의 비밀번호
#   SUPABASE_SERVICE_ROLE_KEY  Supabase > Project Settings > API Keys 의 service_role
#   ANTHROPIC_API_KEY        console.anthropic.com 에서 발급한 Claude API 키

name: 뉴스 서비스 설치

on:
  workflow_dispatch:
    inputs:
      drop_ledger:
        description: "가계부 표도 삭제한다 (되돌릴 수 없음)"
        type: boolean
        default: false
      run_pipeline:
        description: "설치 후 뉴스 수집을 한 번 실행해 본다"
        type: boolean
        default: true

concurrency:
  group: setup-news-service
  cancel-in-progress: false

env:
  PROJECT_REF: unpkytftbetzoernnedc

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: 필요한 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client jq

      - name: Supabase CLI 설치
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 준비물 확인
        run: |
          missing=""
          [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]     || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]      || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]         || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets 에 아직 등록되지 않은 항목:$missing"
            echo "Settings > Secrets and variables > Actions 에서 등록한 뒤 다시 실행하세요."
            exit 1
          fi
          echo "필요한 값 4개 모두 확인됨"

      - name: 데이터베이스 접속 경로 찾기
        id: db
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          region=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects \
            | jq -r --arg ref "$PROJECT_REF" '.[] | select(.id == $ref) | .region' | head -1)
          echo "프로젝트 지역: ${region:-알 수 없음}"

          # 접속 가능한 주소를 순서대로 시도한다.
          candidates=""
          if [ -n "$region" ] && [ "$region" != "null" ]; then
            candidates="aws-0-$region.pooler.supabase.com|postgres.$PROJECT_REF
          aws-1-$region.pooler.supabase.com|postgres.$PROJECT_REF"
          fi
          candidates="$candidates
          db.$PROJECT_REF.supabase.co|postgres"

          found=""
          for entry in $(echo "$candidates" | tr -d ' ' | grep -v '^$'); do
            host="${entry%%|*}"
            user="${entry##*|}"
            echo "시도: $host (사용자 $user)"
            if psql -h "$host" -p 5432 -U "$user" -d postgres -tAc "select 1" >/dev/null 2>&1; then
              echo "접속 성공: $host"
              echo "host=$host" >> "$GITHUB_OUTPUT"
              echo "user=$user" >> "$GITHUB_OUTPUT"
              found="yes"
              break
            fi
          done

          if [ -z "$found" ]; then
            echo "::error::데이터베이스에 접속하지 못했습니다. SUPABASE_DB_PASSWORD 가 맞는지 확인해 주세요."
            exit 1
          fi

      - name: 1. 뉴스 표 만들기
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql -h "${{ steps.db.outputs.host }}" -p 5432 -U "${{ steps.db.outputs.user }}" \
            -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260829010000_news_issue_timeline.sql
          echo "뉴스 표 준비 완료"

      - name: 2. 가계부 표 삭제
        if: ${{ inputs.drop_ledger }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "가계부 표를 삭제합니다. 되돌릴 수 없습니다."
          psql -h "${{ steps.db.outputs.host }}" -p 5432 -U "${{ steps.db.outputs.user }}" \
            -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260829020000_drop_household_ledger.sql

      - name: 3. AI 열쇠 등록
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          echo "AI 열쇠 등록 완료"

      - name: 4. 수집 프로그램 올리기
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in news-collect news-cluster news-timeline news-pipeline; do
            echo "--- $fn 배포 중 ---"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
          echo "함수 4개 배포 완료"

      - name: 5. 5분마다 자동 실행 예약
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql -h "${{ steps.db.outputs.host }}" -p 5432 -U "${{ steps.db.outputs.user }}" \
            -d postgres -v ON_ERROR_STOP=1 \
            -v project_url="https://$PROJECT_REF.supabase.co" \
            -v service_key="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -f supabase/sql/news_pipeline_cron_ci.sql

      - name: 6. 뉴스 수집 한 번 실행해 보기
        if: ${{ inputs.run_pipeline }}
        run: |
          echo "첫 수집을 실행합니다. 1~2분 걸릴 수 있습니다."
          curl -sS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/news-pipeline" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 300 -d '{}' > result.json || true
          echo "===== 실행 결과 ====="
          jq . result.json 2>/dev/null || cat result.json
          echo "===================="

      - name: 7. 언론사별 수집 상태
        if: ${{ inputs.run_pipeline }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql -h "${{ steps.db.outputs.host }}" -p 5432 -U "${{ steps.db.outputs.user }}" \
            -d postgres -c \
            "select name, last_status, coalesce(left(last_error, 60), '') as error from news_sources order by last_status desc, name;"
          psql -h "${{ steps.db.outputs.host }}" -p 5432 -U "${{ steps.db.outputs.user }}" \
            -d postgres -c \
            "select count(*) as 수집된_기사, (select count(*) from issues) as 만들어진_이슈 from articles;"
