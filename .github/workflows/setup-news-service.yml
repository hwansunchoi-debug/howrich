# 뉴스 서비스를 Supabase 에 설치한다.
#
# GitHub > Actions > "뉴스 서비스 설치" > Run workflow 로 실행한다.
# 먼저 GitHub > Settings > Secrets and variables > Actions 에
# 아래 4개를 등록해야 한다.
#   SUPABASE_ACCESS_TOKEN    supabase.com/dashboard/account/tokens 에서 발급
#   SUPABASE_DB_PASSWORD     Supabase > Project Settings > Database 의 비밀번호
#   SUPABASE_SERVICE_ROLE_KEY  Supabase > Project Settings > API Keys 의 service_role
#   ANTHROPIC_API_KEY        console.anthropic.com 에서 발급한 Claude API 키

name: 뉴스 서비스 설치

on:
  workflow_dispatch:
    inputs:
      drop_ledger:
        description: "가계부 표도 삭제한다 (되돌릴 수 없음)"
        type: boolean
        default: false
      run_pipeline:
        description: "설치 후 뉴스 수집을 한 번 실행해 본다"
        type: boolean
        default: true
      ai_model:
        description: "사용할 AI 모델 (haiku 가 저렴, opus 가 정확)"
        type: choice
        default: claude-haiku-4-5
        options:
          - claude-haiku-4-5
          - claude-sonnet-5
          - claude-opus-5

concurrency:
  group: setup-news-service
  cancel-in-progress: false

env:
  PROJECT_REF: unpkytftbetzoernnedc

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: 필요한 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client jq

      - name: Supabase CLI 설치
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 준비물 확인
        run: |
          missing=""
          [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]     || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]      || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]         || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets 에 아직 등록되지 않은 항목:$missing"
            echo "Settings > Secrets and variables > Actions 에서 등록한 뒤 다시 실행하세요."
            exit 1
          fi
          echo "필요한 값 4개 모두 확인됨"

      - name: 데이터베이스 접속 경로 찾기
        id: db
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # 1) Supabase 에 접속 주소를 직접 물어본다. (가장 정확)
          pooler=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler" 2>/dev/null)
          api_host=$(echo "$pooler" | jq -r '.db_host // empty' 2>/dev/null | head -1)
          api_port=$(echo "$pooler" | jq -r '.db_port // empty' 2>/dev/null | head -1)
          api_user=$(echo "$pooler" | jq -r '.db_user // empty' 2>/dev/null | head -1)
          if [ -n "$api_host" ]; then
            echo "Supabase 가 알려준 주소: $api_host:${api_port:-5432} (사용자 ${api_user:-미상})"
          else
            echo "Supabase 가 접속 주소를 알려주지 않았습니다. 알려진 형식으로 시도합니다."
          fi

          # 2) 지역을 확인해 풀러 주소를 만든다.
          region=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF" \
            | jq -r 'select(type == "object") | .region // empty' 2>/dev/null | head -1)
          if [ -z "$region" ]; then
            region=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              https://api.supabase.com/v1/projects \
              | jq -r --arg ref "$PROJECT_REF" 'select(type == "array") | .[] | select(.id == $ref) | .region' 2>/dev/null | head -1)
          fi
          echo "프로젝트 지역: ${region:-알 수 없음}"

          if [ -z "$region" ] || [ "$region" = "null" ]; then
            regions="ap-northeast-2 ap-northeast-1 us-east-1 us-west-1 ap-southeast-1 eu-central-1"
          else
            regions="$region"
          fi

          # 후보 목록: 주소|사용자|포트
          candidates=""
          if [ -n "$api_host" ]; then
            candidates="$api_host|${api_user:-postgres.$PROJECT_REF}|${api_port:-5432}"
          fi
          for r in $regions; do
            candidates="$candidates
          aws-0-$r.pooler.supabase.com|postgres.$PROJECT_REF|5432
          aws-1-$r.pooler.supabase.com|postgres.$PROJECT_REF|5432
          aws-0-$r.pooler.supabase.com|postgres.$PROJECT_REF|6543
          aws-1-$r.pooler.supabase.com|postgres.$PROJECT_REF|6543"
          done
          candidates="$candidates
          db.$PROJECT_REF.supabase.co|postgres|5432"

          found=""
          auth_failed_host=""
          for entry in $(echo "$candidates" | tr -d ' ' | grep -v '^$'); do
            host=$(echo "$entry" | cut -d'|' -f1)
            user=$(echo "$entry" | cut -d'|' -f2)
            port=$(echo "$entry" | cut -d'|' -f3)
            echo "--- 시도: $host:$port (사용자 $user)"
            if out=$(psql -h "$host" -p "$port" -U "$user" -d postgres -tAc "select 1" 2>&1); then
              echo "접속 성공"
              echo "host=$host" >> "$GITHUB_OUTPUT"
              echo "user=$user" >> "$GITHUB_OUTPUT"
              echo "port=$port" >> "$GITHUB_OUTPUT"
              found="yes"
              break
            else
              reason=$(echo "$out" | head -2 | tr '\n' ' ')
              echo "    실패: $reason"
              # 서버가 프로젝트를 알아봤는데 비밀번호만 틀린 경우를 기억해 둔다.
              case "$reason" in
                *"password authentication failed"*) auth_failed_host="$host:$port" ;;
              esac
            fi
          done

          if [ -z "$found" ]; then
            if [ -n "$auth_failed_host" ]; then
              echo "::error::비밀번호가 맞지 않습니다. 주소($auth_failed_host)는 정확합니다."
              echo ""
              echo "데이터베이스 비밀번호는 조회할 수 없고 새로 정하는 방법뿐입니다."
              echo "  1) https://supabase.com/dashboard/project/$PROJECT_REF/settings/database"
              echo "  2) Database password > Reset database password 로 새 비밀번호 생성 후 복사"
              echo "  3) GitHub > Settings > Secrets and variables > Actions 에서"
              echo "     SUPABASE_DB_PASSWORD 를 새 값으로 수정 (앞뒤 공백이 들어가지 않게)"
              echo "  4) 이 워크플로를 다시 실행"
            else
              echo "::error::데이터베이스에 접속하지 못했습니다. 위의 실패 사유를 확인해 주세요."
            fi
            exit 1
          fi

      - name: 1. 뉴스 표 만들기
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql -h "${{ steps.db.outputs.host }}" -p "${{ steps.db.outputs.port }}" -U "${{ steps.db.outputs.user }}" \
            -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260829010000_news_issue_timeline.sql
          echo "뉴스 표 준비 완료"

      - name: 2. 가계부 표 삭제
        if: ${{ inputs.drop_ledger }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "가계부 표를 삭제합니다. 되돌릴 수 없습니다."
          psql -h "${{ steps.db.outputs.host }}" -p "${{ steps.db.outputs.port }}" -U "${{ steps.db.outputs.user }}" \
            -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260829020000_drop_household_ledger.sql

      - name: 3. AI 열쇠 등록
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          supabase secrets set --project-ref "$PROJECT_REF" \
            NEWS_AI_MODEL="${{ inputs.ai_model }}"

          # 웹 화면의 "지금 분석하기" 버튼을 쓰려면 이 열쇠가 필요하다.
          if [ -n "${{ secrets.NEWS_ADMIN_KEY }}" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" \
              NEWS_ADMIN_KEY="${{ secrets.NEWS_ADMIN_KEY }}"
            echo "관리자 열쇠 등록 완료"
          else
            echo "NEWS_ADMIN_KEY 가 없어 건너뜁니다."
            echo "웹 화면의 실행 버튼을 쓰려면 GitHub Secrets 에 NEWS_ADMIN_KEY 를 추가하세요."
          fi
          echo "AI 열쇠 등록 완료 (모델: ${{ inputs.ai_model }})"

      - name: 4. 수집 프로그램 올리기
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in news-collect news-cluster news-timeline news-pipeline; do
            echo "--- $fn 배포 중 ---"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
          echo "함수 4개 배포 완료"

      - name: 5. 자동 실행 예약 (기사 수집 15분마다)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql -h "${{ steps.db.outputs.host }}" -p "${{ steps.db.outputs.port }}" -U "${{ steps.db.outputs.user }}" \
            -d postgres -v ON_ERROR_STOP=1 \
            -v project_url="https://$PROJECT_REF.supabase.co" \
            -v service_key="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -f supabase/sql/news_pipeline_cron_ci.sql

      - name: 6. 뉴스 수집 한 번 실행해 보기
        if: ${{ inputs.run_pipeline }}
        run: |
          echo "첫 수집을 실행합니다. 1~2분 걸릴 수 있습니다."
          curl -sS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/news-pipeline" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 300 -d '{}' > result.json || true
          echo "===== 실행 결과 ====="
          jq . result.json 2>/dev/null || cat result.json
          echo "===================="

      - name: 7. 언론사별 수집 상태
        if: ${{ inputs.run_pipeline }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql -h "${{ steps.db.outputs.host }}" -p "${{ steps.db.outputs.port }}" -U "${{ steps.db.outputs.user }}" \
            -d postgres -c \
            "select name, last_status, coalesce(left(last_error, 60), '') as error from news_sources order by last_status desc, name;"
          psql -h "${{ steps.db.outputs.host }}" -p "${{ steps.db.outputs.port }}" -U "${{ steps.db.outputs.user }}" \
            -d postgres -c \
            "select count(*) as 수집된_기사, (select count(*) from issues) as 만들어진_이슈 from articles;"
