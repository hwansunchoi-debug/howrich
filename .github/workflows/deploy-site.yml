# 뉴스 서비스 화면을 GitHub Pages 에 올린다.
# main 에 변경이 올라오면 자동으로 다시 배포한다.
name: 홈페이지 배포

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: Pages 설정
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 빌드
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run build
          # 새로고침이나 주소 직접 입력에도 화면이 뜨도록 한다.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
